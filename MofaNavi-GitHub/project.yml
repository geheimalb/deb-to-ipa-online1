name: MofaNavi
options:
  bundleIdPrefix: de.mofanavi
  deploymentTarget:
    iOS: "17.0"
targets:
  MofaNavi:
    type: application
    platform: iOS
    sources:
      - MofaNavi
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mofa Navi
        UILaunchScreen:
          UIImageName: LaunchLogo
        NSLocationWhenInUseUsageDescription: Für die Navigation und die Streckenprüfung.
        UIBackgroundModes:
          - location
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mofanavi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
