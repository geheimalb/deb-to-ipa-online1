name: MofaNavi
options:
  bundleIdPrefix: com.geheimalb
  deploymentTarget:
    iOS: "17.0"
targets:
  MofaNavi:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - .github
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geheimalb.mofanavi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Mofa Navi braucht deinen Standort für die Navigation."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "Mofa Navi braucht deinen Standort für die Navigation."
