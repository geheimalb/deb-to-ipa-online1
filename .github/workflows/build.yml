name: MofaNavi
options:
  bundleIdPrefix: com.geheimalb
  deploymentTarget:
    iOS: "17.0"
targets:
  MofaNavi:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geheimalb.mofanavi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "Mofa Navi braucht deinen Standort für die Navigation."
